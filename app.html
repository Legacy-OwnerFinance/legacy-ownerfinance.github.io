<style id="lof-splash-css">html.lof-splash-on,html.lof-splash-on body{background:#031432}#lof-splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;background:#031432;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .4s ease;-webkit-tap-highlight-color:transparent}#lof-splash.lof-hide{opacity:0;pointer-events:none}#lof-splash img{width:min(66vw,340px);height:auto;opacity:0;animation:lofIn .7s ease .05s forwards,lofPulse 2.2s ease-in-out .8s infinite}@keyframes lofIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@keyframes lofPulse{0%,100%{opacity:1}50%{opacity:.72}}@media (prefers-reduced-motion:reduce){#lof-splash img{animation:lofIn .01s forwards}}</style>

<script>
(function(){var d=document,h=d.documentElement,t0=Date.now(),done=false,asked=false;h.className+=' lof-splash-on';
function unbg(){h.className=h.className.replace(/\s*lof-splash-on/,'')}
function kill(){var e=d.getElementById('lof-splash');if(e&&e.parentNode)e.parentNode.removeChild(e);var r=d.getElementById('app-root');if(r&&!r.firstChild&&window.MutationObserver){var mo=new MutationObserver(function(){if(r.firstChild){mo.disconnect();unbg()}});mo.observe(r,{childList:true})}else unbg()}
function hide(){if(done)return;done=true;var e=d.getElementById('lof-splash');if(!e){kill();return}e.className+=' lof-hide';setTimeout(kill,450)}
function cap(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(r,ms)})])}
function imgDone(i){return new Promise(function(r){if(i.complete){r();return}i.addEventListener('load',r);i.addEventListener('error',r)})}
function raf2(){return new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})})}
// The splash stays until the first real screen is painted: app rendered, fonts, first card photos and map tiles loaded. Hard fallback 12 s.
window.legacySplashHide=function(){
  if(asked)return;asked=true;
  var fonts=(d.fonts&&d.fonts.ready)?cap(d.fonts.ready,5000):Promise.resolve();
  var logo=d.querySelector('#lof-splash img'),logoP=logo?cap(imgDone(logo),5000):Promise.resolve();
  var vh=window.innerHeight||800;
  var imgs=[].slice.call(d.querySelectorAll('#app-root .prop-card img[data-img], #app-root .main-logo')).filter(function(i){var r=i.getBoundingClientRect();return r.top<vh&&r.bottom>0}).slice(0,8).map(imgDone);
  var photos=cap(Promise.all(imgs),3000);
  var tiles=d.getElementById('inventory-map')?cap(new Promise(function(r){var n=0,t=setInterval(function(){if(d.querySelector('#inventory-map .leaflet-tile-loaded')||++n>30){clearInterval(t);r()}},100)}),3500):Promise.resolve();
  Promise.all([fonts,logoP,photos,tiles]).then(raf2).then(function(){return new Promise(function(r){setTimeout(r,Math.max(250,700-(Date.now()-t0)))})}).then(hide,hide);
};
setTimeout(hide,12000);})();
</script>
