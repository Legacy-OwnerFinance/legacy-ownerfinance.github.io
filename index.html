  <script>
    (function(){
      var lang='es';
      try{
        var saved=localStorage.getItem('legacy_lang');
        if(saved==='en'||saved==='es')lang=saved;
        else{
          var list=(navigator.languages&&navigator.languages.length)?navigator.languages:(navigator.language?[navigator.language]:[]);
          var primary=String(list[0]||'').toLowerCase();
          lang=primary.indexOf('en')===0?'en':'es';
        }
      }catch(e){}
      document.documentElement.lang=lang;
      window.__legacyLang=lang;
    })();
